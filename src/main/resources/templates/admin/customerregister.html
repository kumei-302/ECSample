<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>顧客登録</title>
</head>
<body>
    <h1>顧客登録</h1>
    <form th:action="@{/customer/register}" th:object="${customerForm}" method="post">
        <label>氏名：<input type="text" th:field="*{name}" /></label><br>
        <label>メール：<input type="email" th:field="*{email}" /></label><br>
        <label>住所：<input type="text" th:field="*{address}" /></label><br>
        <button type="submit">登録</button>
    </form>
</body>
</html>

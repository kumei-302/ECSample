<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理 - ECショップ管理画面</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .admin-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .product-card {
            transition: transform 0.2s;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .btn-custom {
            border-radius: 20px;
            padding: 0.5rem 1.5rem;
        }
        .search-section {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <div class="container">
            <h1 class="display-4"><i class="fas fa-boxes me-3"></i>商品管理</h1>
            <p class="lead">商品の登録・編集・削除を管理できます</p>
        </div>
    </header>

    <div class="container">
        <!-- アラートメッセージ -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- 検索セクション -->
        <div class="search-section">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <form th:action="@{/admin/products/search}" method="get" class="d-flex">
                        <input type="text" name="keyword" th:value="${keyword}" 
                               class="form-control me-2" placeholder="商品名で検索...">
                        <button type="submit" class="btn btn-outline-primary btn-custom">
                            <i class="fas fa-search"></i> 検索
                        </button>
                    </form>
                </div>
                <div class="col-md-4 text-end">
                    <a th:href="@{/admin/products/add}" class="btn btn-success btn-custom">
                        <i class="fas fa-plus"></i> 新商品追加
                    </a>
                </div>
            </div>
        </div>

        <!-- 商品一覧 -->
        <div class="row">
            <div th:if="${#lists.isEmpty(products)}" class="col-12">
                <div class="text-center py-5">
                    <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
                    <h4 class="text-muted">商品が登録されていません</h4>
                    <p class="text-muted">新しい商品を追加してください。</p>
                    <a th:href="@{/admin/products/add}" class="btn btn-primary btn-custom">
                        <i class="fas fa-plus"></i> 商品を追加
                    </a>
                </div>
            </div>

            <div th:each="product : ${products}" class="col-lg-4 col-md-6 mb-4">
                <div class="card product-card h-100">
                    <div class="card-header bg-light">
                        <h6 class="card-title mb-0 fw-bold" th:text="${product.name}">商品名</h6>
                    </div>
                    <div class="card-body">
                        <p class="card-text text-muted small" th:text="${product.description}">商品説明</p>
                        <div class="row">
                            <div class="col-6">
                                <span class="badge bg-primary">価格</span>
                                <div class="fw-bold text-primary" th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '円'">0円</div>
                            </div>
                            <div class="col-6">
                                <span class="badge bg-info">在庫</span>
                                <div class="fw-bold" th:classappend="${product.stock <= 5} ? 'text-danger' : 'text-success'" 
                                     th:text="${product.stock} + '個'">0個</div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent">
                        <div class="btn-group w-100" role="group">
                            <a th:href="@{/admin/products/edit/{id}(id=${product.id})}" 
                               class="btn btn-outline-primary btn-sm">
                                <i class="fas fa-edit"></i> 編集
                            </a>
                            <button type="button" class="btn btn-outline-danger btn-sm" 
                                    th:onclick="'confirmDelete(' + ${product.id} + ', \'' + ${product.name} + '\')'">
                                <i class="fas fa-trash"></i> 削除
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 統計情報 -->
        <div th:if="${!#lists.isEmpty(products)}" class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fas fa-chart-bar me-2"></i>商品統計</h5>
                        <div class="row text-center">
                            <div class="col-md-3">
                                <div class="h4 text-primary" th:text="${#lists.size(products)}">0</div>
                                <small class="text-muted">総商品数</small>
                            </div>
                            <div class="col-md-3">
                                <div class="h4 text-success" th:text="${#aggregates.sum(products.![stock])}">0</div>
                                <small class="text-muted">総在庫数</small>
                            </div>
                            <div class="col-md-3">
                                <div class="h4 text-info" th:text="${#numbers.formatInteger(#aggregates.avg(products.![price]), 0, 'COMMA')} + '円'">0円</div>
                                <small class="text-muted">平均価格</small>
                            </div>
                            <div class="col-md-3">
                                <div class="h4 text-warning" th:text="${#lists.size(products.?[stock <= 5])}">0</div>
                                <small class="text-muted">在庫少商品</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 削除確認モーダル -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-exclamation-triangle text-warning me-2"></i>削除確認</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>以下の商品を削除してもよろしいですか？</p>
                    <div class="alert alert-warning">
                        <strong id="productNameToDelete"></strong>
                    </div>
                    <p class="text-danger small"><i class="fas fa-info-circle me-1"></i>この操作は元に戻せません。</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                    <form id="deleteForm" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash"></i> 削除する
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        function confirmDelete(productId, productName) {
            document.getElementById('productNameToDelete').textContent = productName;
            document.getElementById('deleteForm').action = '/admin/products/delete/' + productId;
            new bootstrap.Modal(document.getElementById('deleteModal')).show();
        }

        // アラートの自動非表示
        setTimeout(function() {
            let alerts = document.querySelectorAll('.alert');
            alerts.forEach(function(alert) {
                let bsAlert = new bootstrap.Alert(alert);
                bsAlert.close();
            });
        }, 5000);
    </script>
</body>
</html>
